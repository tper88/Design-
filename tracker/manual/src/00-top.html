<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker builder — user guide</title>
<style><!--M:CSS--></style>
<script>
/* Język ustawiany przed pierwszym malowaniem, żeby nie mignęła druga wersja. */
(function () {
  var lang = null;
  try { lang = localStorage.getItem('tb-manual-lang'); } catch (e) { /* tryb prywatny */ }
  if (lang !== 'pl' && lang !== 'en') {
    var nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
    lang = /^pl/i.test(nav) ? 'pl' : 'en';
  }
  document.documentElement.setAttribute('data-lang', lang);
  document.documentElement.setAttribute('lang', lang);
})();
</script>
</head>
